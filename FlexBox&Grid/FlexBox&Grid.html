<!DOCTYPE html>
<html>
<head>
    <title>Responsive Layout</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        /* Flexbox Navigation */

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#333;
            color:white;
            padding:15px 30px;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:20px;
        }

        nav a{
            color:white;
            text-decoration:none;
        }

        /* Grid Layout */

        .container{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            padding:20px;
        }

        .card{
            background:white;
            padding:30px;
            text-align:center;
            border-radius:8px;
            box-shadow:0 0 5px gray;
        }

        /* Responsive */

        @media(max-width:768px){

            nav{
                flex-direction:column;
                gap:10px;
            }

            nav ul{
                flex-direction:column;
                text-align:center;
            }

            .container{
                grid-template-columns:repeat(2,1fr);
            }

        }

        @media(max-width:480px){

            .container{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

    <nav>
        <h2>🛒SmartCart</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="container">

    <div class="card">
        <h3>Smartphone</h3>
        <p>Price: ₹15,999</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Laptop</h3>
        <p>Price: ₹55,000</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Headphones</h3>
        <p>Price: ₹2,499</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Smart Watch</h3>
        <p>Price: ₹3,999</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Shoes</h3>
        <p>Price: ₹1,999</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Backpack</h3>
        <p>Price: ₹899</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
