<!DOCTYPE html>
<html>
<head>
<style>
.container{
    display:grid;
    grid-template-columns:100px 100px 100px;
    gap:10px;
}

.box{
    background-color:lightgreen;
    height:100px;
    text-align:center;
    line-height:100px;
}
</style>
</head>
<body>

<div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
</div>

</body>
</html>
